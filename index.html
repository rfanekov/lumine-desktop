<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Lumine Desktop</title>
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <style>
      html,
      body {
        background: #000000;
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <img class="brand-mark" src="/logo.webp" alt="" draggable="false" />
        <span class="brand-name">LUMINE</span>
      </div>

      <nav class="tabs" role="tablist" aria-label="Khu vực làm việc">
        <button
          class="tab is-active"
          type="button"
          role="tab"
          aria-selected="true"
          data-tab="portal"
        >
          Portal
        </button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-tab="panel">
          Control Panel
        </button>
      </nav>

      <div class="actions">
        <button
          id="reload"
          class="icon-btn"
          type="button"
          title="Tải lại trang"
          aria-label="Tải lại trang"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
          </svg>
        </button>
        <button
          id="external"
          class="icon-btn"
          type="button"
          title="Mở bằng trình duyệt"
          aria-label="Mở bằng trình duyệt"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 3h6v6" />
            <path d="M10 14 21 3" />
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          </svg>
        </button>
        <button
          id="minimize"
          class="icon-btn win-btn"
          type="button"
          title="Thu nhỏ"
          aria-label="Thu nhỏ"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
        </button>
        <button
          id="maximize"
          class="icon-btn win-btn"
          type="button"
          title="Phóng to hoặc thu hồi"
          aria-label="Phóng to hoặc thu hồi"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="5" width="14" height="14" rx="1.5" />
          </svg>
        </button>
        <button
          id="close"
          class="icon-btn win-btn close-btn"
          type="button"
          title="Đóng"
          aria-label="Đóng cửa sổ"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
    </header>

    <main class="stage" aria-hidden="true">
      <p class="stage-label">Lumine Desktop</p>
    </main>
  </body>
</html>
