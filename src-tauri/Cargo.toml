[package]
name = "lumine-desktop"
version = "0.1.0"
description = "Lumine Desktop - Portal and Control Panel in one window"
authors = ["Lumine"]
edition = "2021"

[lib]
name = "lumine_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
time = "0.3"
